[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-ai-chatbot"
version = "1.0.0"
description = "Adds the Asyntai AI chat assistant to a Streamlit app. It answers visitor questions from your own content, in more than 80 languages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asyntai", email = "hello@asyntai.com" }]
keywords = ["streamlit", "streamlit-component", "chatbot", "ai", "ai-chatbot", "live-chat", "customer-support", "assistant", "widget"]
dependencies = ["streamlit>=1.28"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://asyntai.com"
Documentation = "https://asyntai.com/documentation/integrations/streamlit/"
Source = "https://github.com/asyntai/streamlit-ai-chatbot"
Issues = "https://github.com/asyntai/streamlit-ai-chatbot/issues"

[tool.setuptools.packages.find]
where = ["src"]
